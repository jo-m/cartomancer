                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/forecast:
    get:
      summary: Get weather forecast along a track
      operationId: getTrackForecast
      tags: [Tracks]
      security: []
      description: >
        Computes a time series of weather conditions at subsampled points
        along the track, given an assumed start time and average speed.
        Points share the same subsampled index space as the /points endpoint.
        Public tracks are accessible anonymously; private tracks require ownership.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: startTime
          in: query
          required: true
          description: Start time in RFC3339 format.
          schema:
            type: string
            format: date-time
        - name: speedKmh
          in: query
          required: true
          description: Average speed in km/h (must be positive, max 200).
          schema:
            type: number
            minimum: 0.1
            maximum: 200
      responses:
        "200":
          description: Forecast time series along the track
          content:
            application/json:
              schema:
                type: object
                required: [forecastStatus, attribution, units, points, sunEvents]
                properties:
                  attribution:
                    $ref: "#/components/schemas/SourceAttribution"
                  forecastStatus:
                    type: string
                    enum: [full, partial, none]
                    description: >
                      Indicates weather data availability: "full" means all points have
                      weather data, "partial" means some points may have gaps, "none" means
                      no weather data is available (time/distance fields are still populated).
                  units:
                    type: object
                    required: [temperatureC, precipitationRate, windSpeedMs, windDirectionDeg, relativeWindDirectionDeg]
                    description: Display units for each time series field.
                    properties:
                      temperatureC:
                        type: string
                        description: Unit for the temperatureC field (e.g. "\u00b0C").
                      precipitationRate:
                        type: string
                        description: Unit for the precipitationRate field (e.g. "mm/h").
                      windSpeedMs:
                        type: string
                        description: Unit for the windSpeedMs field (e.g. "m/s").
                      windDirectionDeg:
                        type: string
                        description: Unit for the windDirectionDeg field (e.g. "deg").
                      relativeWindDirectionDeg:
                        type: string
                        description: Unit for the relativeWindDirectionDeg field (e.g. "deg").
                  sunEvents:
                    type: array
                    description: Sunrise, sunset, dawn, and dusk events that fall within the ride window.
                    items:
                      type: object
                      required: [type, time, distanceM]
                      properties:
                        type:
                          type: string
                          enum: [dawn, sunrise, sunset, dusk]
                          description: Type of sun event.
                        time:
                          type: string
                          format: date-time
                          description: Time of the sun event.
                        distanceM:
                          type: number
                          description: Estimated distance along the track in meters when this event occurs.
                  points:
                    type: array
                    items:
                      type: object
                      required: [index, distanceM, time]
                      properties:
                        index:
                          type: integer
                          description: Index into the subsampled points array (shared with /points endpoint).
                        distanceM:
                          type: number
                          description: Cumulative distance in meters from the start.
                        time:
                          type: string
                          format: date-time
                          description: Estimated time at this point.
                        temperatureC:
                          type: number
                          nullable: true
                          description: Temperature in degrees Celsius, or null if unavailable.
                        precipitationRate:
                          type: number
                          nullable: true
                          description: Precipitation rate in mm/h, or null if unavailable.
                        windSpeedMs:
                          type: number
                          nullable: true
                          description: Wind speed in m/s, or null if unavailable.
                        windDirectionDeg:
                          type: number
                          nullable: true
                          description: Meteorological wind direction in degrees (direction wind blows from, 0=N, 90=E), or null if unavailable.
                        relativeWindDirectionDeg:
                          type: number
                          nullable: true
                          description: Wind direction relative to direction of travel in degrees (0=headwind, 180=tailwind, 90=crosswind from right), or null if unavailable.
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Track has too few points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

