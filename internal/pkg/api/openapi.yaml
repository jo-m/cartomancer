openapi: 3.0.3
info:
  title: Cartomancer API
  version: 0.1.0
  description: |
    REST API for managing GPX/FIT tracks for cycling and running.

    ## Authentication

    All requests pass through the session middleware, which auto-creates an
    anonymous session (JWT in an HTTP-only, SameSite=Strict cookie).
    Logging in promotes the session to an authenticated one.

    ### Access levels

    | Level      | Description                                              |
    |------------|----------------------------------------------------------|
    | **public** | No authentication required. Anonymous sessions suffice.  |
    | **user**   | Requires a logged-in user.                    |
    | **admin**  | Requires a logged-in user with `admin = true`.           |

    Endpoints that require **user** access return `401` if the session is
    anonymous. Endpoints that require **admin** access return `401` if
    anonymous, or `403` if the user is not an admin.

servers:
  - url: /api
    description: Same-origin

security:
  - cookieAuth: []

tags:
  - name: App
    description: Application configuration
  - name: Auth
    description: Registration, login, and session management
  - name: Tracks
    description: Track upload, retrieval, editing, and management
  - name: Tags
    description: Tag suggestions
  - name: Account
    description: Current user account management
  - name: Stars
    description: Track starring
  - name: Comments
    description: Track comments
  - name: Admin
    description: Administrative user management
  - name: Geocode
    description: Geocoding API
  - name: Maps
    description: PMTiles map file access

paths:
  /app_config:
    get:
      summary: Get public application configuration
      operationId: getAppConfig
      tags: [App]
      security: []
      responses:
        "200":
          description: Application configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

  /version:
    get:
      summary: Get build version information
      operationId: getVersion
      tags: [App]
      security: []
      responses:
        "200":
          description: Build version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{uuid}/avatar:
    get:
      summary: Get user avatar SVG
      operationId: getUserAvatar
      tags: [Account]
      security: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG avatar image
          content:
            image/svg+xml:
              schema:
                type: string
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{uuid}/stars:
    get:
      summary: Get starred tracks for a user
      operationId: getUserStars
      tags: [Stars]
      security: []
      description: >
        Returns all tracks starred by the given user that are visible to the
        caller. Anonymous callers see only stars on public tracks.
        Authenticated callers also see stars on tracks they own.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of starred tracks (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/star:
    post:
      summary: Star a track
      operationId: starTrack
      tags: [Stars]
      description: >
        Stars the given track for the authenticated user.
        Starring a track that is already starred is idempotent.
        Private tracks owned by other users cannot be starred (returns 404).
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Track starred (or was already starred)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Unstar a track
      operationId: unstarTrack
      tags: [Stars]
      description: >
        Removes the authenticated user's star from the given track.
        No visibility check is performed; stars on private tracks can always be removed.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Star removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Star not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/comments:
    get:
      summary: List comments on a track
      operationId: listTrackComments
      tags: [Comments]
      security: []
      description: >
        Returns all comments on the given track. Anonymous callers can only
        see comments on public tracks. Deleted comments have an empty body
        and deleted=true.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentsListResponse"
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Create a comment on a track
      operationId: createTrackComment
      tags: [Comments]
      description: >
        Adds a comment to the given track. The caller must be authenticated
        and the track must be visible (own track or public).
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/comments/{commentUUID}:
    patch:
      summary: Edit a comment
      operationId: editTrackComment
      tags: [Comments]
      description: >
        Edits the body of a comment. Only the comment author can edit.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: commentUUID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditCommentRequest"
      responses:
        "204":
          description: Comment updated
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed to edit this comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a comment
      operationId: deleteTrackComment
      tags: [Comments]
      description: >
        Soft-deletes a comment (body is cleared, marked as deleted).
        The comment author or the track owner can delete a comment.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: commentUUID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Comment deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed to delete this comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /register:
    post:
      summary: Register a new user
      operationId: register
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created (or email already exists), confirmation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MsgResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Registration is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Name already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /confirm-email:
    post:
      summary: Confirm email (registration or email change)
      operationId: confirmEmail
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTokenRequest"
      responses:
        "200":
          description: Email confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MsgResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already taken (email change only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Token expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/login:
    post:
      summary: Log in
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/logout:
    post:
      summary: Log out
      operationId: logout
      tags: [Auth]
      security: []
      responses:
        "204":
          description: Logout successful
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions:
    get:
      summary: Get current session
      operationId: getSession
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Current session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

  /tracks:
    get:
      summary: List and filter tracks
      operationId: listTracks
      tags: [Tracks]
      parameters:
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, total_distance_m, total_ascent_m]
            default: created_at
          description: Column to sort results by.
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: public
          in: query
          schema:
            type: boolean
        - name: onlyMine
          in: query
          schema:
            type: boolean
          description: >
            When true and authenticated, restricts results to tracks owned by the
            current user (ignoring public tracks from other users).
        - name: onlyStarred
          in: query
          schema:
            type: boolean
          description: >
            When true and authenticated, restricts results to tracks starred by
            the current user.
        - name: fileFormat
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: trackType
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: sport
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: subSport
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: tag
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by tag names.
        - name: tagsAnd
          in: query
          schema:
            type: boolean
          description: >
            When true, all listed tags must be present on the track (AND).
            When false (default), any one listed tag suffices (OR).
        - name: name
          in: query
          schema:
            type: string
          description: Substring match on name
        - name: description
          in: query
          schema:
            type: string
          description: Substring match on description
        - name: source
          in: query
          schema:
            type: string
          description: Substring match on source
        - name: createdAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: createdAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: originalCreatedAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: originalCreatedAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: totalDistanceMMin
          in: query
          schema:
            type: number
            format: double
        - name: totalDistanceMMax
          in: query
          schema:
            type: number
            format: double
        - name: totalAscentMMin
          in: query
          schema:
            type: number
            format: double
        - name: totalAscentMMax
          in: query
          schema:
            type: number
            format: double
        - name: startLatMin
          in: query
          schema:
            type: number
            format: double
        - name: startLatMax
          in: query
          schema:
            type: number
            format: double
        - name: startLonMin
          in: query
          schema:
            type: number
            format: double
        - name: startLonMax
          in: query
          schema:
            type: number
            format: double
        - name: endLatMin
          in: query
          schema:
            type: number
            format: double
        - name: endLatMax
          in: query
          schema:
            type: number
            format: double
        - name: endLonMin
          in: query
          schema:
            type: number
            format: double
        - name: endLonMax
          in: query
          schema:
            type: number
            format: double
        - name: startNearLat
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: latitude of center point (requires startNearLon and startNearRadiusM)"
        - name: startNearLon
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: longitude of center point (requires startNearLat and startNearRadiusM)"
        - name: startNearRadiusM
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: radius in meters around the start point"
        - name: endNearLat
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: latitude of center point (requires endNearLon and endNearRadiusM)"
        - name: endNearLon
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: longitude of center point (requires endNearLat and endNearRadiusM)"
        - name: endNearRadiusM
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: radius in meters around the end point"
      responses:
        "200":
          description: List of matching tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTracksResponse"
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: Bulk edit tracks
      operationId: bulkEditTracks
      tags: [Tracks]
      description: >
        Update a subset of fields across multiple tracks at once.
        Only provided fields are applied. All tracks must belong to the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEditTracksRequest"
      responses:
        "204":
          description: Tracks updated
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One or more tracks not found or not owned by the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Upload a track file
      operationId: uploadTrack
      tags: [Tracks]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A .gpx or .fit file (max 5 MiB)
      responses:
        "201":
          description: Track created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid file or unsupported format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Track validation failed: fewer than 3 or more than 100000 points,
            distance below 10 m or above 10000 km
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/polylines/5m:
    get:
      summary: List 5m-simplified preview polylines for matching tracks
      operationId: listTrackPolylines5m
      tags: [Tracks]
      description: >
        Returns the 5 m Douglas-Peucker simplified preview polylines for
        tracks matching the same filters as listTracks (page/pageSize are
        ignored). Suitable for fullscreen rendering. Up to a fixed
        server-side limit of tracks is returned; clients should display a
        banner when totalCount exceeds the result size. pendingCount
        reports how many matching tracks still lack a backfilled polyline.
        The response is ETagged so revalidation is cheap.
      parameters: &trackPolylinesParams
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, total_distance_m, total_ascent_m]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: public
          in: query
          schema:
            type: boolean
        - name: onlyMine
          in: query
          schema:
            type: boolean
        - name: onlyStarred
          in: query
          schema:
            type: boolean
        - name: fileFormat
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: trackType
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: sport
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: subSport
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: tag
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: tagsAnd
          in: query
          schema:
            type: boolean
        - name: name
          in: query
          schema:
            type: string
        - name: description
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: createdAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: createdAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: originalCreatedAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: originalCreatedAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: totalDistanceMMin
          in: query
          schema:
            type: number
            format: double
        - name: totalDistanceMMax
          in: query
          schema:
            type: number
            format: double
        - name: totalAscentMMin
          in: query
          schema:
            type: number
            format: double
        - name: totalAscentMMax
          in: query
          schema:
            type: number
            format: double
        - name: startLatMin
          in: query
          schema:
            type: number
            format: double
        - name: startLatMax
          in: query
          schema:
            type: number
            format: double
        - name: startLonMin
          in: query
          schema:
            type: number
            format: double
        - name: startLonMax
          in: query
          schema:
            type: number
            format: double
        - name: endLatMin
          in: query
          schema:
            type: number
            format: double
        - name: endLatMax
          in: query
          schema:
            type: number
            format: double
