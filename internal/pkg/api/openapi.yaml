      tags: [Admin]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: Update a user
      operationId: adminUpdateUser
      tags: [Admin]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required or target is an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cannot demote the last admin account, or name/email conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a user
      operationId: adminDeleteUser
      tags: [Admin]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Cannot delete own account via admin endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cannot delete the last admin account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{uuid}/reset-password:
    post:
      summary: Reset a user's password
      description: >
        Generates a new random password for the user and returns it in the response body (display once).
      operationId: adminResetUserPassword
      tags: [Admin]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Password reset; new password returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResetPasswordResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required, or attempting to reset own password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{uuid}/confirm-email:
    post:
      summary: Confirm a user's pending email verification
      description: >
        Confirms any pending email verification for the user. If the verification
        is for a different email (email change), the user's email is updated. If
        it is for the same email (registration), the email is marked as confirmed.
      operationId: adminConfirmEmail
      tags: [Admin]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Email confirmed; updated user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required or target is an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account:
    patch:
      summary: Update current user's profile
      operationId: updateMe
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete current user's account
      operationId: deleteMe
      tags: [Account]
      responses:
        "204":
          description: Account deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Cannot delete the last admin account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/change-password:
    post:
      summary: Change current user's password
      operationId: changePassword
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/change-email:
    post:
      summary: Request email change
      operationId: changeEmail
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
      responses:
        "200":
          description: Confirmation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MsgResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/rotate-avatar:
    post:
      summary: Generate a new random avatar seed
      operationId: rotateAvatar
      tags: [Account]
      responses:
        "200":
          description: Avatar rotated, updated user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/export:
    get:
      summary: Export all personal data as a ZIP archive
      operationId: exportData
      tags: [Account]
      description: |
        GDPR-style data export. Streams a ZIP file containing all of the
        authenticated user's track files and a metadata.json with user
        profile and track metadata. Excludes generated data (forecasts,
        location summaries).
      responses:
        "200":
          description: ZIP archive containing tracks and metadata
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tags:
    get:
      summary: List the current user's tags, optionally filtered by prefix
      operationId: suggestTags
      tags: [Tags]
      description: |
        Returns the authenticated user's tags together with the number of their
        own tracks carrying each tag, ordered by count descending then tag
        alphabetically. If `prefix` is supplied, only tags starting with it
        are returned. Anonymous callers get an empty list.
      parameters:
        - name: prefix
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tag suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSuggestionResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tags/public:
    get:
      summary: List tags used on public tracks, optionally filtered by prefix
      operationId: suggestPublicTags
      tags: [Tags]
      security: []
      description: |
        Returns tag names that appear on public tracks (grouped by tag string
        across all users), together with the number of distinct public tracks
        carrying each tag. Ordered by count descending, then tag alphabetically.
        Accessible without authentication.
      parameters:
        - name: prefix
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Tag suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSuggestionResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /geocode/search/name:
    get:
      summary: Search populated places by name
      operationId: searchGeocodeName
      tags: [Geocode]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query (minimum 2 characters, matched as prefix against ASCII name)
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeSearchResponse"
        "400":
          description: Query too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /maps:
    get:
      summary: List ready PMTiles map builds
      operationId: listMapBuilds
      tags: [Maps]
      security: []
      responses:
        "200":
          description: List of ready map builds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MapBuildResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /maps/{uuid}:
    get:
      summary: Download a PMTiles map file
      description: >
        Serves the PMTiles file for the given build UUID. Supports HTTP range
        requests for efficient partial reads (as required by the PMTiles spec).
      operationId: getMapFile
      tags: [Maps]
      security: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Full PMTiles file content
          content:
            application/vnd.pmtiles:
              schema:
                type: string
                format: binary
        "206":
          description: Partial PMTiles file content (range request)
          content:
            application/vnd.pmtiles:
              schema:
                type: string
                format: binary
        "404":
          description: Map build not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/forecasts:
    get:
      summary: List all forecasts with file metadata
      description: >
        Returns all forecast rows with their associated forecast_files metadata
        (excluding binary blob data). Files are nested under each forecast.
      operationId: adminListForecasts
      tags: [Admin]
      responses:
        "200":
          description: All forecasts with nested file metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminForecastsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/maps:
    get:
      summary: List all map builds
      description: Returns all map builds regardless of ready or deletion status.
      operationId: adminListMapBuilds
      tags: [Admin]
      responses:
        "200":
          description: All map builds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMapBuildResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/maps/{uuid}/mark-for-deletion:
    post:
      summary: Mark a map build for deletion
      description: Sets the marked_for_deletion flag. The cleaner job will remove the file and record.
      operationId: adminMarkMapForDeletion
      tags: [Admin]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Map build marked for deletion
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: >
        JWT session token set automatically by the session middleware.
        Logging in via POST /sessions/login promotes the anonymous session
        to an authenticated one. The cookie is HTTP-only, SameSite=Strict.

  schemas:
    LonLat:
      type: object
      required:
        - lat
        - lon
      properties:
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double

    BBox:
      type: object
      required:
        - min
        - max
      properties:
        min:
          $ref: "#/components/schemas/LonLat"
        max:
          $ref: "#/components/schemas/LonLat"

    MinMax:
      type: object
      required:
        - min
        - max
      properties:
        min:
          type: number
          format: double
          nullable: true
        max:
          type: number
          format: double
          nullable: true

    UserRef:
      type: object
      required:
        - uuid
        - name
      properties:
        uuid:
          type: string
        name:
          type: string

    SourceAttribution:
      type: object
      required:
        - text
        - href
      properties:
        text:
          type: string
        href:
          type: string

    AppConfig:
      type: object
      required:
        - externalBaseUrl
        - instanceName
        - registrationEnabled
        - demoMode
      properties:
        externalBaseUrl:
          type: string
        instanceName:
          type: string
        registrationEnabled:
          type: boolean
        demoMode:
          type: boolean
          description: Whether the instance is running in demo mode.
        demoEmail:
          type: string
          description: Demo login email (only present when demoMode is true).
        demoPassword:
          type: string
          description: Demo login password (only present when demoMode is true).

    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z_-]{3,32}$'
          description: 3-32 chars, letters/underscores/hyphens only, no consecutive underscores or hyphens
        password:
          type: string

    ConfirmTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    MsgResponse:
      type: object
      required:
        - msg
      properties:
        msg:
          type: string

    ChangeEmailRequest:
      type: object
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          format: email
        password:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SessionResponse:
      type: object
      required:
        - sessionUuid
      properties:
        sessionUuid:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required:
        - uuid
        - email
        - name
        - admin
        - avatarSeed
      properties:
        uuid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        admin:
          type: boolean
        avatarSeed:
          type: string
        locationName:
          type: string
          nullable: true
        locationLat:
          type: number
          format: double
          nullable: true
        locationLon:
          type: number
          format: double
          nullable: true

    AdminUser:
      type: object
      required:
        - uuid
        - email
        - name
        - admin
        - createdAt
        - updatedAt
        - hasPendingEmailVerification
      properties:
        uuid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        admin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
        hasPendingEmailVerification:
          type: boolean

    UpdateMeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z_-]{3,32}$'
          description: 3-32 chars, letters/underscores/hyphens only, no consecutive underscores or hyphens
        location:
          nullable: true
          description: User's location, or null to clear
          type: object
          required:
            - name
            - lat
            - lon
          properties:
            name:
              type: string
            lat:
              type: number
              format: double
            lon:
              type: number
              format: double

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string

    AdminCreateUserRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z_-]{3,32}$'
          description: 3-32 chars, letters/underscores/hyphens only, no consecutive underscores or hyphens
        admin:
          type: boolean

    AdminCreateUserResponse:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required:
            - initialPassword
          properties:
            initialPassword:
              type: string
              description: Generated initial password, shown once

    AdminUpdateUserRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z_-]{3,32}$'
          description: 3-32 chars, letters/underscores/hyphens only, no consecutive underscores or hyphens
        admin:
          type: boolean

    AdminResetPasswordResponse:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: The new generated password (display once)

    TrackResponse:
      type: object
      required:
        - uuid
        - name
        - fileFormat
        - trackType
        - sport
        - subSport
        - totalDistanceM
        - totalAscentM
        - createdAt
        - updatedAt
        - public
        - tags
        - user
        - similarTracks
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          type: string
        author:
          type: string
        authorLinkUrl:
          type: string
        fileFormat:
          type: integer
        trackType:
          type: integer
        linkUrl:
          type: string
        sport:
          type: integer
        subSport:
          type: integer
        totalDistanceM:
          type: number
          format: double
        totalAscentM:
          type: number
          format: double
        elevation:
          $ref: "#/components/schemas/MinMax"
        start:
          $ref: "#/components/schemas/LonLat"
        end:
          $ref: "#/components/schemas/LonLat"
        bounds:
          $ref: "#/components/schemas/BBox"
        originalCreatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        public:
          type: boolean
        initialEditingCompleted:
          type: boolean
        starred:
          type: boolean
        isOwner:
          type: boolean
        user:
          $ref: "#/components/schemas/UserRef"
        tags:
          type: array
          items:
            type: string
        geonameLabel:
          type: string
        similarTracks:
          type: array
          items:
            $ref: "#/components/schemas/SimilarTrackEntry"
        forecast:
          $ref: "#/components/schemas/TrackForecastSummary"

    TrackForecastSummary:
      type: object
      description: Pre-computed weather forecast summary for a track (28 km/h, starting in 1h).
      required:
        - forecastReferenceTime
        - startTime
      properties:
