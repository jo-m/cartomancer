      responses:
        "204":
          description: User deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required or target is an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{uuid}/reset-password:
    post:
      summary: Reset a user's password
      description: >
        Generates a new random password for the user and returns it in the response body (display once).
      operationId: adminResetUserPassword
      tags: [Admin]
      parameters:
        - name: uuid
