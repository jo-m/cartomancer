                $ref: "#/components/schemas/AdminResetPasswordResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Admin access required or target is an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users/{uuid}/confirm-email:
    post:
      summary: Confirm a user's pending email verification
      description: >
        Confirms any pending email verification for the user. If the verification
        is for a different email (email change), the user's email is updated. If
        it is for the same email (registration), the email is marked as confirmed.
      operationId: adminConfirmEmail
      tags: [Admin]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
