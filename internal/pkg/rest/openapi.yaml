openapi: 3.0.3
info:
  title: Detour API
  version: 0.1.0

paths:
  /sessions/login:
    post:
      summary: Log in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/logout:
    post:
      summary: Log out
      operationId: logout
      responses:
        "204":
          description: Logout successful
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/me:
    get:
      summary: Get current session
      operationId: getSession
      responses:
        "200":
          description: Current session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

  /tracks:
    post:
      summary: Upload a track file
      operationId: uploadTrack
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A .gpx or .fit file
      responses:
        "201":
          description: Track created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid file or unsupported format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/tags:
    put:
      summary: Set tags for a track
      operationId: setTrackTags
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                minLength: 2
                maxLength: 32
      responses:
        "200":
          description: Tags updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tags:
    get:
      summary: Suggest tags by prefix
      operationId: suggestTags
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Tag suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSuggestionResponse"
        "400":
          description: Prefix too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SessionResponse:
      type: object
      required:
        - sessionUuid
      properties:
        sessionUuid:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required:
        - uuid
        - email
        - name
      properties:
        uuid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string

    TrackResponse:
      type: object
      required:
        - uuid
        - name
        - fileFormat
        - trackType
        - sport
        - subSport
        - totalDistanceM
        - totalAscentM
        - createdAt
        - updatedAt
        - tags
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          type: string
        author:
          type: string
        authorLinkUrl:
          type: string
        fileFormat:
          type: integer
        trackType:
          type: integer
        linkUrl:
          type: string
        sport:
          type: integer
        subSport:
          type: integer
        totalDistanceM:
          type: number
          format: double
        totalAscentM:
          type: number
          format: double
        originalCreatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string

    TagSuggestionResponse:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            type: string

    Error:
      type: object
      required:
        - msg
      properties:
        msg:
          type: string
