          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /account/rotate-avatar:
    post:
      summary: Generate a new random avatar seed
      operationId: rotateAvatar
      tags: [Account]
      responses:
        "200":
          description: Avatar rotated, updated user returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tags:
    get:
      summary: Suggest tags by prefix
      operationId: suggestTags
      tags: [Tags]
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Tag suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSuggestionResponse"
        "400":
          description: Prefix too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: >
        JWT session token set automatically by the session middleware.
        Logging in via POST /sessions/login promotes the anonymous session
        to an authenticated one. The cookie is HTTP-only, SameSite=Strict.

  schemas:
    AppConfig:
      type: object
      required:
        - externalBaseUrl
        - instanceName
        - trackColor
      properties:
        externalBaseUrl:
          type: string
        instanceName:
          type: string
        trackColor:
          type: string

    RegisterRequest:
      type: object
      required:
        - email
        - name
        - password
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z_-]{3,32}$'
          description: 3-32 chars, letters/underscores/hyphens only, no consecutive underscores or hyphens
        password:
          type: string

    ConfirmTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    MsgResponse:
      type: object
      required:
        - msg
      properties:
        msg:
          type: string

    ChangeEmailRequest:
      type: object
      required:
        - newEmail
        - password
      properties:
        newEmail:
          type: string
          format: email
        password:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SessionResponse:
      type: object
      required:
        - sessionUuid
      properties:
        sessionUuid:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required:
        - uuid
        - email
        - name
        - admin
        - avatarSeed
      properties:
        uuid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        admin:
          type: boolean
        avatarSeed:
          type: string

    AdminUser:
      type: object
      required:
        - uuid
        - email
        - name
        - admin
        - createdAt
        - updatedAt
      properties:
        uuid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        admin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time

    UpdateMeRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z_-]{3,32}$'
          description: 3-32 chars, letters/underscores/hyphens only, no consecutive underscores or hyphens

    ChangePasswordRequest:
      type: object
      required:
        - oldPassword
        - newPassword
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string

    AdminCreateUserRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z_-]{3,32}$'
          description: 3-32 chars, letters/underscores/hyphens only, no consecutive underscores or hyphens
        admin:
          type: boolean

    AdminCreateUserResponse:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required:
            - initialPassword
          properties:
            initialPassword:
              type: string
              description: Generated initial password, shown once

    AdminUpdateUserRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[a-zA-Z_-]{3,32}$'
          description: 3-32 chars, letters/underscores/hyphens only, no consecutive underscores or hyphens
        admin:
          type: boolean

    AdminResetPasswordResponse:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: The new generated password (display once)

    TrackResponse:
      type: object
      required:
        - uuid
        - name
        - fileFormat
        - trackType
        - sport
        - subSport
        - totalDistanceM
        - totalAscentM
        - createdAt
        - updatedAt
        - public
        - tags
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          type: string
        author:
          type: string
        authorLinkUrl:
          type: string
        fileFormat:
          type: integer
        trackType:
          type: integer
        linkUrl:
          type: string
        sport:
          type: integer
        subSport:
          type: integer
        totalDistanceM:
          type: number
          format: double
        totalAscentM:
          type: number
          format: double
        minElevationM:
          type: number
          format: double
          nullable: true
        maxElevationM:
          type: number
          format: double
          nullable: true
        startLat:
          type: number
          format: double
        startLon:
          type: number
          format: double
        endLat:
          type: number
          format: double
        endLon:
          type: number
          format: double
        boundsMinLat:
          type: number
          format: double
        boundsMinLon:
          type: number
          format: double
        boundsMaxLat:
          type: number
          format: double
        boundsMaxLon:
          type: number
          format: double
        originalCreatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        public:
          type: boolean
        initialEditingCompleted:
          type: boolean
        starred:
          type: boolean
        isOwner:
          type: boolean
        tags:
          type: array
          items:
            type: string

    EditTrackRequest:
      type: object
      required:
        - name
        - trackType
        - sport
        - subSport
        - public
        - tags
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
        author:
          type: string
        authorLinkUrl:
          type: string
        trackType:
          type: integer
        linkUrl:
          type: string
        sport:
          type: integer
        subSport:
          type: integer
        public:
          type: boolean
        tags:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 32

    EditingResponse:
      type: object
      required:
        - tracks
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackResponse"

    EditingCompleteRequest:
      type: object
      required:
        - uuids
      properties:
        uuids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 1000
          description: UUIDs of tracks to mark as upload-editing completed

    BulkEditTracksRequest:
      type: object
      required:
        - uuids
      properties:
        uuids:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 100
          description: UUIDs of tracks to update
        public:
          type: boolean
        source:
          type: string
        author:
          type: string
        authorLinkUrl:
          type: string
        trackType:
          type: integer
        linkUrl:
          type: string
        sport:
          type: integer
        subSport:
          type: integer
        tags:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 32
          description: Replaces all tags on every track with this list. Omit to leave tags unchanged.

    TrackStatisticsResponse:
      type: object
      required:
        - totalDistanceMMin
        - totalDistanceMMax
        - totalAscentMMin
        - totalAscentMMax
      properties:
        totalDistanceMMin:
          type: number
          format: double
          nullable: true
          description: Null when there are no visible tracks.
        totalDistanceMMax:
          type: number
          format: double
          nullable: true
          description: Null when there are no visible tracks.
        totalAscentMMin:
          type: number
          format: double
          nullable: true
          description: Null when there are no visible tracks.
        totalAscentMMax:
          type: number
          format: double
          nullable: true
          description: Null when there are no visible tracks.

    ListTracksResponse:
      type: object
      required:
        - tracks
        - totalCount
        - page
        - pageSize
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackResponse"
        totalCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    TagSuggestionResponse:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
