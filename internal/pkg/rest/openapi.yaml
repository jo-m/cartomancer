openapi: 3.0.3
info:
  title: Detour API
  version: 0.1.0
  description: |
    REST API for managing GPX/FIT tracks for cycling and running.

    ## Authentication

    All requests pass through the session middleware, which auto-creates an
    anonymous session (JWT in an HTTP-only, SameSite=Strict cookie).
    Logging in promotes the session to an authenticated one.

    ### Access levels

    | Level      | Description                                              |
    |------------|----------------------------------------------------------|
    | **public** | No authentication required. Anonymous sessions suffice.  |
    | **user**   | Requires a logged-in user.                    |
    | **admin**  | Requires a logged-in user with `admin = true`.           |

    Endpoints that require **user** access return `401` if the session is
    anonymous. Endpoints that require **admin** access return `401` if
    anonymous, or `403` if the user is not an admin.

servers:
  - url: /api
    description: Same-origin

security:
  - cookieAuth: []

tags:
  - name: App
    description: Application configuration
  - name: Auth
    description: Registration, login, and session management
  - name: Tracks
    description: Track upload, retrieval, editing, and management
  - name: Tags
    description: Tag suggestions
  - name: Account
    description: Current user account management
  - name: Stars
    description: Track starring
  - name: Admin
    description: Administrative user management

paths:
  /app_config:
    get:
      summary: Get public application configuration
      operationId: getAppConfig
      tags: [App]
      security: []
      responses:
        "200":
          description: Application configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"

  /users/{uuid}/avatar:
    get:
      summary: Get user avatar SVG
      operationId: getUserAvatar
      tags: [Account]
      security: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SVG avatar image
          content:
            image/svg+xml:
              schema:
                type: string
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{uuid}/stars:
    get:
      summary: Get starred tracks for a user
      operationId: getUserStars
      tags: [Stars]
      security: []
      description: >
        Returns all tracks starred by the given user that are visible to the
        caller. Anonymous callers see only stars on public tracks.
        Authenticated callers also see stars on tracks they own.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of starred tracks (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/star:
    post:
      summary: Star a track
      operationId: starTrack
      tags: [Stars]
      description: >
        Stars the given track for the authenticated user.
        Starring a track that is already starred is idempotent.
        Private tracks owned by other users cannot be starred (returns 404).
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Track starred (or was already starred)
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Unstar a track
      operationId: unstarTrack
      tags: [Stars]
      description: >
        Removes the authenticated user's star from the given track.
        No visibility check is performed; stars on private tracks can always be removed.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Star removed
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Star not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /register:
    post:
      summary: Register a new user
      operationId: register
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created, confirmation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MsgResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /confirm-email:
    post:
      summary: Confirm email (registration or email change)
      operationId: confirmEmail
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTokenRequest"
      responses:
        "200":
          description: Email confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MsgResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already taken (email change only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Token expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/login:
    post:
      summary: Log in
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/logout:
    post:
      summary: Log out
      operationId: logout
      tags: [Auth]
      security: []
      responses:
        "204":
          description: Logout successful
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions:
    get:
      summary: Get current session
      operationId: getSession
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Current session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

  /tracks:
    get:
      summary: List and filter tracks
      operationId: listTracks
      tags: [Tracks]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: public
          in: query
          schema:
            type: boolean
        - name: onlyMine
          in: query
          schema:
            type: boolean
          description: >
            When true and authenticated, restricts results to tracks owned by the
            current user (ignoring public tracks from other users).
        - name: onlyStarred
          in: query
          schema:
            type: boolean
          description: >
            When true and authenticated, restricts results to tracks starred by
            the current user.
        - name: fileFormat
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: trackType
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: sport
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: subSport
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: tag
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: Filter by tag names.
        - name: tagsAnd
          in: query
          schema:
            type: boolean
          description: >
            When true, all listed tags must be present on the track (AND).
            When false (default), any one listed tag suffices (OR).
        - name: name
          in: query
          schema:
            type: string
          description: Substring match on name
        - name: description
          in: query
          schema:
            type: string
          description: Substring match on description
        - name: source
          in: query
          schema:
            type: string
          description: Substring match on source
        - name: createdAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: createdAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: originalCreatedAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: originalCreatedAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: totalDistanceMMin
          in: query
          schema:
            type: number
            format: double
        - name: totalDistanceMMax
          in: query
          schema:
            type: number
            format: double
        - name: totalAscentMMin
          in: query
          schema:
            type: number
            format: double
        - name: totalAscentMMax
          in: query
          schema:
            type: number
            format: double
        - name: startLatMin
          in: query
          schema:
            type: number
            format: double
        - name: startLatMax
          in: query
          schema:
            type: number
            format: double
        - name: startLonMin
          in: query
          schema:
            type: number
            format: double
        - name: startLonMax
          in: query
          schema:
            type: number
            format: double
        - name: endLatMin
          in: query
          schema:
            type: number
            format: double
        - name: endLatMax
          in: query
          schema:
            type: number
            format: double
        - name: endLonMin
          in: query
          schema:
            type: number
            format: double
        - name: endLonMax
          in: query
          schema:
            type: number
            format: double
        - name: startNearLat
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: latitude of center point (requires startNearLon and startNearRadiusM)"
        - name: startNearLon
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: longitude of center point (requires startNearLat and startNearRadiusM)"
        - name: startNearRadiusM
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: radius in meters around the start point"
        - name: endNearLat
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: latitude of center point (requires endNearLon and endNearRadiusM)"
        - name: endNearLon
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: longitude of center point (requires endNearLat and endNearRadiusM)"
        - name: endNearRadiusM
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: radius in meters around the end point"
      responses:
        "200":
          description: List of matching tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTracksResponse"
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: Bulk edit tracks
      operationId: bulkEditTracks
      tags: [Tracks]
      description: >
        Update a subset of fields across multiple tracks at once.
        Only provided fields are applied. All tracks must belong to the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEditTracksRequest"
      responses:
        "204":
          description: Tracks updated
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One or more tracks not found or not owned by the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Upload a track file
      operationId: uploadTrack
      tags: [Tracks]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A .gpx or .fit file (max 5 MiB)
      responses:
        "201":
          description: Track created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid file or unsupported format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            Track validation failed: fewer than 3 or more than 100000 points,
            distance below 10 m or above 10000 km
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}:
    get:
      summary: Get a track by UUID
      operationId: getTrack
      tags: [Tracks]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Track found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: Edit a track
      operationId: editTrack
      tags: [Tracks]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTrackRequest"
      responses:
        "200":
          description: Track updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      summary: Delete a track
      operationId: deleteTrack
      tags: [Tracks]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Track deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/tags:
    put:
      summary: Set tags for a track
      operationId: setTrackTags
      tags: [Tracks]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                minLength: 2
                maxLength: 32
      responses:
        "200":
          description: Tags updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the track owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/download:
    get:
      summary: Download the original track file
      operationId: downloadTrackBlob
      tags: [Tracks]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Original track file (GPX or FIT)
          content:
            application/gpx+xml:
              schema:
                type: string
                format: binary
            application/vnd.ant.fit:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/profile.svg:
    get:
      summary: Download the track altitude profile SVG
      operationId: downloadTrackProfileSVG
      tags: [Tracks]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: Canvas width in pixels (16–512, default 512). Height is size/3.
          schema:
            type: integer
            minimum: 16
            maximum: 512
            default: 512
      responses:
        "200":
          description: Track altitude profile SVG image
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/preview.svg:
    get:
      summary: Download the track preview SVG
      operationId: downloadTrackPreviewSVG
      tags: [Tracks]
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: Square canvas size in pixels (16–512, default 512).
          schema:
            type: integer
            minimum: 16
            maximum: 512
            default: 512
      responses:
        "200":
          description: Track preview SVG image
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/points:
    get:
      summary: Get track points
      operationId: getTrackPoints
      tags: [Tracks]
      description: >
        Returns track points with elevation and cumulative distance.
        Public tracks are accessible without authentication; private tracks
        require the owner's session.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Track points
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: array
                    items:
                      type: object
                      required: [lat, lon, ele, d]
                      properties:
                        lat:
                          type: number
                        lon:
                          type: number
                        ele:
                          type: number
                          description: Elevation in meters
                        d:
                          type: number
                          description: Cumulative distance in meters
        "304":
          description: Not modified
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/forecast:
    post:
      summary: Get weather forecast along a track
      operationId: getTrackForecast
      tags: [Tracks]
      security: []
      description: >
        Computes a time series of weather conditions at subsampled points
        along the track, given an assumed start time and average speed.
        Points share the same subsampled index space as the /points endpoint.
        Public tracks are accessible anonymously; private tracks require ownership.
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
        - name: startTime
          in: query
          required: true
          description: Start time in RFC3339 format.
          schema:
            type: string
            format: date-time
        - name: speedKmh
          in: query
          required: true
          description: Average speed in km/h (must be positive, max 200).
          schema:
            type: number
            minimum: 0.1
            maximum: 200
      responses:
        "200":
          description: Forecast time series along the track
          content:
            application/json:
              schema:
                type: object
                required: [forecastStatus, attribution, attributionHref, points]
                properties:
                  attribution:
                    type: string
                    description: Human-readable data source credit.
                  attributionHref:
                    type: string
                    description: URL for the data source.
                  forecastStatus:
                    type: string
                    enum: [full, partial, none]
                    description: >
                      Indicates weather data availability: "full" means all points have
                      weather data, "partial" means some points may have gaps, "none" means
                      no weather data is available (time/distance fields are still populated).
                  points:
                    type: array
                    items:
                      type: object
                      required: [index, distanceM, lat, lon, time]
                      properties:
                        index:
                          type: integer
                          description: Index into the subsampled points array (shared with /points endpoint).
                        distanceM:
                          type: number
                          description: Cumulative distance in meters from the start.
                        lat:
                          type: number
                        lon:
                          type: number
                        time:
                          type: string
                          format: date-time
                          description: Estimated time at this point.
                        temperatureC:
                          type: number
                          nullable: true
                          description: Temperature in degrees Celsius, or null if unavailable.
                        precipitationRate:
                          type: number
                          nullable: true
                          description: Precipitation rate, or null if unavailable.
        "400":
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Track has too few points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/statistics:
    get:
      summary: Get track statistics
      operationId: getTrackStatistics
      tags: [Tracks]
      description: >
        Returns aggregate statistics (min/max distance and ascent) for tracks
        visible to the caller. Unauthenticated callers see only public tracks.
        All fields are null when there are no visible tracks.
      parameters:
        - name: onlyMine
          in: query
          schema:
            type: boolean
          description: >
            When true and authenticated, restricts statistics to tracks owned by
            the current user.
      responses:
        "200":
          description: Track statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackStatisticsResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/editing:
    get:
      summary: List tracks pending initial editing
      operationId: listTracksForEditing
      tags: [Tracks]
      description: >
        Returns all tracks belonging to the authenticated user where
        initial_editing_completed is false, ordered by upload time (newest first).
      responses:
        "200":
          description: List of active upload tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditingResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/editing-complete:
    post:
      summary: Mark tracks as initial editing completed
      operationId: editingComplete
      tags: [Tracks]
      description: >
        Sets initial_editing_completed to true for the given tracks.
        All tracks must belong to the authenticated user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditingCompleteRequest"
      responses:
        "204":
          description: Tracks marked as upload-editing completed
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One or more tracks not found or not owned by the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

