openapi: 3.0.3
info:
  title: Detour API
  version: 0.1.0

paths:
  /sessions/login:
    post:
      summary: Log in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/logout:
    post:
      summary: Log out
      operationId: logout
      responses:
        "204":
          description: Logout successful
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /sessions/me:
    get:
      summary: Get current session
      operationId: getSession
      responses:
        "200":
          description: Current session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"

  /tracks:
    get:
      summary: List and filter tracks
      operationId: listTracks
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: public
          in: query
          schema:
            type: boolean
        - name: fileFormat
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: trackType
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: sport
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: subSport
          in: query
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - name: name
          in: query
          schema:
            type: string
          description: Substring match on name
        - name: description
          in: query
          schema:
            type: string
          description: Substring match on description
        - name: source
          in: query
          schema:
            type: string
          description: Substring match on source
        - name: createdAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: createdAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: updatedAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: originalCreatedAtMin
          in: query
          schema:
            type: string
            format: date-time
        - name: originalCreatedAtMax
          in: query
          schema:
            type: string
            format: date-time
        - name: totalDistanceMMin
          in: query
          schema:
            type: number
            format: double
        - name: totalDistanceMMax
          in: query
          schema:
            type: number
            format: double
        - name: totalAscentMMin
          in: query
          schema:
            type: number
            format: double
        - name: totalAscentMMax
          in: query
          schema:
            type: number
            format: double
        - name: startLatMin
          in: query
          schema:
            type: number
            format: double
        - name: startLatMax
          in: query
          schema:
            type: number
            format: double
        - name: startLonMin
          in: query
          schema:
            type: number
            format: double
        - name: startLonMax
          in: query
          schema:
            type: number
            format: double
        - name: endLatMin
          in: query
          schema:
            type: number
            format: double
        - name: endLatMax
          in: query
          schema:
            type: number
            format: double
        - name: endLonMin
          in: query
          schema:
            type: number
            format: double
        - name: endLonMax
          in: query
          schema:
            type: number
            format: double
        - name: startNearLat
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: latitude of center point (requires startNearLon and startNearRadiusM)"
        - name: startNearLon
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: longitude of center point (requires startNearLat and startNearRadiusM)"
        - name: startNearRadiusM
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: radius in meters around the start point"
        - name: endNearLat
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: latitude of center point (requires endNearLon and endNearRadiusM)"
        - name: endNearLon
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: longitude of center point (requires endNearLat and endNearRadiusM)"
        - name: endNearRadiusM
          in: query
          schema:
            type: number
            format: double
          description: "Radial filter: radius in meters around the end point"
      responses:
        "200":
          description: List of matching tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTracksResponse"
        "400":
          description: Invalid filter parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Upload a track file
      operationId: uploadTrack
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A .gpx or .fit file
      responses:
        "201":
          description: Track created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid file or unsupported format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}:
    get:
      summary: Get a track by UUID
      operationId: getTrack
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Track found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      summary: Edit a track
      operationId: editTrack
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditTrackRequest"
      responses:
        "200":
          description: Track updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/tags:
    put:
      summary: Set tags for a track
      operationId: setTrackTags
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                minLength: 2
                maxLength: 32
      responses:
        "200":
          description: Tags updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackResponse"
        "400":
          description: Invalid tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tracks/{uuid}/blob:
    get:
      summary: Download the original track file
      operationId: downloadTrackBlob
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Original track file (GPX or FIT)
          content:
            application/gpx+xml:
              schema:
                type: string
                format: binary
            application/vnd.ant.fit:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Track not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /tags:
    get:
      summary: Suggest tags by prefix
      operationId: suggestTags
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          description: Tag suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagSuggestionResponse"
        "400":
          description: Prefix too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SessionResponse:
      type: object
      required:
        - sessionUuid
      properties:
        sessionUuid:
          type: string
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required:
        - uuid
        - email
        - name
      properties:
        uuid:
          type: string
        email:
          type: string
          format: email
        name:
          type: string

    TrackResponse:
      type: object
      required:
        - uuid
        - name
        - fileFormat
        - trackType
        - sport
        - subSport
        - totalDistanceM
        - totalAscentM
        - createdAt
        - updatedAt
        - public
        - tags
      properties:
        uuid:
          type: string
        name:
          type: string
        description:
          type: string
        source:
          type: string
        author:
          type: string
        authorLinkUrl:
          type: string
        fileFormat:
          type: integer
        trackType:
          type: integer
        linkUrl:
          type: string
        sport:
          type: integer
        subSport:
          type: integer
        totalDistanceM:
          type: number
          format: double
        totalAscentM:
          type: number
          format: double
        startLat:
          type: number
          format: double
        startLon:
          type: number
          format: double
        endLat:
          type: number
          format: double
        endLon:
          type: number
          format: double
        originalCreatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        public:
          type: boolean
        tags:
          type: array
          items:
            type: string

    EditTrackRequest:
      type: object
      required:
        - name
        - trackType
        - sport
        - subSport
        - public
        - tags
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
        author:
          type: string
        authorLinkUrl:
          type: string
        trackType:
          type: integer
        linkUrl:
          type: string
        sport:
          type: integer
        subSport:
          type: integer
        public:
          type: boolean
        tags:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 32

    ListTracksResponse:
      type: object
      required:
        - tracks
        - totalCount
        - page
        - pageSize
      properties:
        tracks:
          type: array
          items:
            $ref: "#/components/schemas/TrackResponse"
        totalCount:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    TagSuggestionResponse:
      type: object
      required:
        - tags
      properties:
        tags:
          type: array
          items:
            type: string

    Error:
      type: object
      required:
        - msg
      properties:
        msg:
          type: string
