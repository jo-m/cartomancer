version: "2"
sql:
  - engine: "sqlite"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "db"
        output_files_suffix: ".gen.go"
        output_models_file_name: "models.gen.go"
        output_db_file_name: "db.gen.go"
        out: "."
        emit_db_tags: false
        emit_prepared_queries: false
        emit_json_tags: false
