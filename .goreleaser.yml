version: 2

release:
  mode: replace
  header: |
    ## Release Notes

    **TODO**

  footer: |
    ## Downloads

    Linux binaries:

    - `cartomancer_{{ .Version }}_linux_x86_64.tar.gz`
    - `cartomancer_{{ .Version }}_linux_aarch64.tar.gz`

    Multi-arch Docker image (linux/x86_64 + linux/aarch64):

    ```
    docker pull ghcr.io/jo-m/cartomancer:{{ .Version }}
    ```

    See all available tags at https://github.com/jo-m/cartomancer/pkgs/container/cartomancer

builds:
  - skip: true

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
