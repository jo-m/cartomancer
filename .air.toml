#:schema https://json.schemastore.org/any.json

root = "."
tmp_dir = "tmp"

[build]
pre_cmd = ["make gen"]
cmd = "go build -o ./tmp/main ."
bin = "tmp/main"
args_bin = ["serve"]
log = "./tmp/air.log"

include_dir = []
include_ext = ["go", "sql"]
include_file = []
exclude_dir = ["tmp", "data", "frontend"]
exclude_file = []
exclude_regex = ["_test\\.go", "\\.gen\\.go"]


delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500 # nanosecond
