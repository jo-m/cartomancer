root = "."
tmp_dir = "tmp"

[build]
pre_cmd = ["make gen"]
cmd = "go build -o ./tmp/main ."
bin = "tmp/main"
log = "./tmp/air.log"

include_dir = []
include_ext = ["go", "qtpl", "sql"]
include_file = []
exclude_dir = ["tmp", "data"]
exclude_file = []
exclude_regex = ["_test\\.go", "\\.gen\\.go", "\\.qtpl\\.go"]


delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500 # nanosecond
