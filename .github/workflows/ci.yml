name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bash -c 'cd frontend && npm ci && npm run gen && npm run lint'

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gen
        run: nix develop --command make gen
      - name: Lint
        run: nix develop --command make lint

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gen
        run: nix develop --command make gen
      - name: Test
        run: nix develop --command make test

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build amd64 binary
        run: nix build .#cartomancer
      - name: Build arm64 binary (cross)
        run: nix build .#cartomancer-aarch64-linux
      - name: Build amd64 Docker image
        run: nix build .#dockerImage
      - name: Build arm64 Docker image (cross)
        run: nix build .#dockerImage-aarch64-linux

  docker-push:
    if: github.event_name == 'push'
    needs: nix-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        id: tag
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '_')" >> "$GITHUB_OUTPUT"
      - name: Build amd64 image
        run: nix build .#dockerImage -o image-amd64.tar.gz
      - name: Build arm64 image
        run: nix build .#dockerImage-aarch64-linux -o image-arm64.tar.gz
      - name: Push per-arch images and multi-arch manifest
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          repo="ghcr.io/jo-m/cartomancer"

          amd64_src=$(docker load < image-amd64.tar.gz | sed -n 's/^Loaded image: //p')
          docker tag "$amd64_src" "$repo:${TAG}-amd64"
          docker push "$repo:${TAG}-amd64"

          arm64_src=$(docker load < image-arm64.tar.gz | sed -n 's/^Loaded image: //p')
          docker tag "$arm64_src" "$repo:${TAG}-arm64"
          docker push "$repo:${TAG}-arm64"

          docker buildx imagetools create -t "$repo:$TAG" \
            "$repo:${TAG}-amd64" \
            "$repo:${TAG}-arm64"
