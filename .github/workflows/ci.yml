name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command bash -c 'cd frontend && npm ci && npm run gen && npm run lint'

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gen
        run: nix develop --command make gen
      - name: Lint
        run: nix develop --command make lint

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gen
        run: nix develop --command make gen
      - name: Test
        run: nix develop --command make test

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build binary
        run: nix build .#cartomancer
      - name: Build Docker image
        run: nix build .#dockerImage

  docker-push:
    if: github.event_name == 'push'
    needs: nix-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        id: tag
        run: echo "value=$(echo '${{ github.ref_name }}' | tr '/' '_')" >> "$GITHUB_OUTPUT"
      - name: Build Docker image with Nix
        run: nix build .#dockerImage -o image.tar.gz
      - name: Load image
        id: load
        run: |
          loaded=$(docker load < image.tar.gz)
          echo "$loaded"
          src=$(echo "$loaded" | sed -n 's/^Loaded image: //p')
          echo "src=$src" >> "$GITHUB_OUTPUT"
      - name: Tag and push
        run: |
          docker tag "${{ steps.load.outputs.src }}" "ghcr.io/jo-m/cartomancer:${{ steps.tag.outputs.value }}"
          docker push "ghcr.io/jo-m/cartomancer:${{ steps.tag.outputs.value }}"
