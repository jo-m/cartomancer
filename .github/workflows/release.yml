name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run goreleaser
        run: nix develop --command goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image with Nix
        run: nix build .#dockerImage -o image.tar.gz
      - name: Load image
        id: load
        run: |
          loaded=$(docker load < image.tar.gz)
          echo "$loaded"
          src=$(echo "$loaded" | sed -n 's/^Loaded image: //p')
          echo "src=$src" >> "$GITHUB_OUTPUT"
      - name: Tag and push
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          stripped="${VERSION#v}"
          minor=$(echo "$stripped" | cut -d. -f1,2)
          for tag in "$stripped" "$minor" latest; do
            docker tag "${{ steps.load.outputs.src }}" "ghcr.io/jo-m/cartomancer:$tag"
            docker push "ghcr.io/jo-m/cartomancer:$tag"
          done
